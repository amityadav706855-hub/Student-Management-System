{% block body %}

<div class="row my-5 pb-5">
  <h1 class="text-center">contact us</h1>
  <div class="col-sm-10 mx-auto shadow">
    <div class="row">
      {% if msg %}
      <div class="col-sm-12">
        <div class="alert alert-danger text-center" role="alert">{{msg}}</div>
      </div>
   {% endif %}
      <div class="col-sm-6">
        <img src="{%static 'images/Screenshot (2).png'%}"- alt="" class="h-100 w-100"/>
      </div>
      <div class="col-sm-6" style="border:2px solid black">
     <form method="post" class="row">  
       
{% csrf_token %}

      <form class="row g-3 ">

        <div class="col-md-12">
          <label  for="name" class="form-label">Name</label>
          <input name="name" type="text" class="form-control" id="name">
          
        </div>
      
        <form class="row g-3 ">
          <div class="col-md-12">
            <label  for="gender" class="form-label">Gender</label>
            <input name="gender" type="radio" value="male" class="form-control-input" id="gender">male
            <input name="gender" type="radio" value="female" class="form-control-input" id="gender">female
          </div>
  
          <div class="col-md-12">
            <label  for="address" class="form-label">Address</label>
            <input name="address" type="textarea" class="form-control" id="address">
            
          </div>
  
          <div class="col-md-12">
            <label  for="contactno" class="form-label">Contact No</label>
            <input name="contactno" type="text" class="form-control" id="contactno">
            
          </div>
  
          <div class="col-md-12">
            <label  for="email" class="form-label">emailaddress</label>
            <input name="emailaddress" type="email" class="form-control" id="emailaddress">
            
          </div>
  
          <div class="col-md-12">
            <label  for="enquirytext" class="form-label">enquiry text</label>
            <textarea name="enquirytext" class="form-control" id="enquirytext"></textarea>
            
          </div>
  
  
  
  
  <br>
  <br>
          
        <div class="col-12 pt-5 mx-5 ms-5 ps-5 pb-3">
          <button type="submit" class="btn btn-primary ">Sign in</button>
        </div>
      </form>





      </form>
      </div>
    </div>
  </div>
</div>
